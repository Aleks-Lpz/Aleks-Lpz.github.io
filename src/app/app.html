<div class="cv-container">
  @if (miPersona) {
    <header>
      <h1>{{ miPersona.nombre }} {{ miPersona.apellido }}</h1>
      <p><strong>Ubicación:</strong> {{ miPersona.domicilio }}</p>
      <p><strong>Teléfono:</strong> {{ miPersona.telefono }}</p>
    </header>

    <section class="foto-perfil">
      <img [src]="miPersona.foto" alt="Foto de perfil" width="150">
    </section>
  } @else {
    <p>Cargando datos del CV...</p>
  }
</div>
