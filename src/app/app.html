<main class="main">
  <div class="content" *ngIf="miPersona">
    <header>
      <h1>{{ miPersona.nombre }} {{ miPersona.apellido }}</h1>
      <p>{{ miPersona.domicilio }} | {{ miPersona.telefono }}</p>
    </header>

    <section class="profile-pic">
      <img [src]="miPersona.foto" alt="Foto de Aleks" width="150">
    </section>
  </div>
</main>
